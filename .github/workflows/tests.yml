name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: python -m pip install --upgrade pip pytest
      - name: 运行单元测试
        run: python -m pytest tests/v3/newapicheckin -q
      - name: 语法编译检查
        run: python -m compileall -q plugins.v3/newapicheckin
